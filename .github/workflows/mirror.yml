name: Mirror synchronization

on:
  workflow_call:
    inputs:
      remote_name:
        required: true
        type: string
      fetch_url:
        required: true
        type: string
      branch:
        required: true
        type: string
      patch_ci:
        required: false
        type: string
        default: true

jobs:
  mirror:
    runs-on: ${{ vars.RUNNER != '' && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}

    steps:
    - uses: analogdevicesinc/doctools/blank@action

    - name: increase-limits
      run: |
        git config http.postBuffer 157286400

    - name: update-mirror
      run: |
        git remote add ${{ inputs.remote_name }} ${{ inputs.fetch_url }} 2>/dev/null || \
          git remote set-url ${{ inputs.remote_name }} ${{ inputs.fetch_url }}
        target_branch=mirror_ci/${{ inputs.remote_name }}/${{ inputs.branch }}
        git remote prune origin
        git remote prune ${{ inputs.remote_name }}
        git fetch ${{ inputs.remote_name }} ${{ inputs.branch }}:$target_branch -f
        git switch $target_branch
        echo "target_branch=$target_branch" >> "$GITHUB_ENV"

    - name: get-ci
      if: inputs.patch_ci == 'true'
      run: |
        get_file () {
          mkdir -p $(dirname $2)
          echo https://raw.githubusercontent.com/analogdevicesinc/linux/refs/heads/ci/$1
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o $2 \
              https://raw.githubusercontent.com/analogdevicesinc/linux/refs/heads/ci/$1
        }

        get_file .github/workflows.template/top-level.yml \
                 .github/workflows/top-level.yml

        git add -f .github/workflows/top-level.yml
        commit=$(git ls-remote origin refs/heads/ci | cut -f1)
        git commit -m "deploy: $commit" -m "patch ci" -s

    - name: push-mirror
      env:
          WORKFLOW_SECRET: ${{ secrets.WORKFLOW_SECRET}}
      if: ${{ env.WORKFLOW_SECRET != '' }}
      run: |
        url_=$(git remote get-url origin)
        url="https://x-access-token:${{ secrets.WORKFLOW_SECRET }}@github.com/${{ github.repository }}.git"
        git remote set-url origin "$url"
        git push origin $target_branch:$target_branch -f || true
        git remote set-url origin "$url_"

    - name: push-mirror
      env:
          WORKFLOW_SECRET: ${{ secrets.WORKFLOW_SECRET}}
      if: ${{ env.WORKFLOW_SECRET == '' }}
      run: |
        git push origin $target_branch:$target_branch -f

    - name: unset-limits
      run: |
        git config --unset http.postBuffer

    - name: clean-up
      if: github.event_name == 'schedule'
      run: |
        git gc --prune=now

    - name: log-cached-branches
      run: |
        git --no-pager branch | cut -c 3- | \
          while IFS= read -r b; do printf "$b: " ; git rev-list --count $b; done
