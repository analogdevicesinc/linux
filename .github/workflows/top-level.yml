name: Kernel build

on:
  push:
    branches:
      - 'main'
      - 'ci/*'
  pull_request:

jobs:
  checks:
    uses: analogdevicesinc/linux/.github/workflows/checks.yml@ci
    secrets: inherit
    permissions:
      contents: read
  build_gcc_x86_64:
    uses: analogdevicesinc/linux/.github/workflows/build.yml@ci
    needs: [checks]
    if: needs.checks.outputs.fatal != 'true'
    secrets: inherit
    permissions:
      contents: read
    with:
      compiler: "gcc"
      arch: "x86"
      defconfig: "adi_ci_defconfig"
  build_llvm_x86_64:
    uses: analogdevicesinc/linux/.github/workflows/build.yml@ci
    needs: [checks]
    if: needs.checks.outputs.fatal != 'true'
    secrets: inherit
    permissions:
      contents: read
    with:
      compiler: "llvm"
      arch: "x86"
      defconfig: "adi_ci_defconfig"
      checks: true
  build_gcc_aarch64:
    uses: analogdevicesinc/linux/.github/workflows/build.yml@ci
    needs: [checks]
    if: needs.checks.outputs.fatal != 'true'
    secrets: inherit
    permissions:
      contents: read
    with:
      compiler: "gcc"
      arch: "arm64"
      defconfig: "adi_ci_defconfig"
  build_gcc_arm:
    uses: analogdevicesinc/linux/.github/workflows/build.yml@ci
    secrets: inherit
    permissions:
      contents: read
    with:
      compiler: "gcc"
      arch: "arm"
      defconfig: "adi_ci_defconfig"
      checks: true
  assert_checks:
    runs-on: [self-hosted, repo-only]
    permissions:
      contents: read
    needs:
      - checks
      - build_gcc_x86_64
      - build_llvm_x86_64
      - build_gcc_aarch64
      - build_gcc_arm

    steps:
      - name: Assert
        env:
          job_checks: ${{ needs.checks.outputs.summary }}
          job_build_gcc_x86_64: ${{ needs.build_gcc_x86_64.outputs.summary }}
          job_build_llvm_x86_64: ${{ needs.build_llvm_x86_64.outputs.summary }}
          job_build_gcc_aarch64: ${{ needs.build_gcc_aarch64.outputs.summary }}
          job_build_gcc_arm: ${{ needs.build_gcc_arm.outputs.summary }}
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -L -o runner_env.sh \
            https://raw.githubusercontent.com/analogdevicesinc/linux/ci/ci/runner_env.sh
          source ./runner_env.sh
          assert_job_summary

  deploy_cloudsmith_checks:
    needs: [assert_checks]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    uses: analogdevicesinc/linux/.github/workflows/upload-to-cloudsmith.yml@ci
    secrets:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
        CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    permissions:
      id-token: write
      contents: write
      actions: read
    with:
      artifacts: >
        adi_ci_defconfig-*

  build_gcc_arm_zynq_xcomm_adv7511_defconfig:
    needs: [assert_checks]
    uses: analogdevicesinc/linux/.github/workflows/build.yml@ci
    secrets: inherit
    permissions:
      contents: read
    with:
      compiler: "gcc"
      arch: "arm"
      defconfig: "zynq_xcomm_adv7511_defconfig"
      auto_from_range: false
  build_gcc_arm_socfpga_adi_defconfig:
    needs: [assert_checks]
    uses: analogdevicesinc/linux/.github/workflows/build.yml@ci
    secrets: inherit
    permissions:
      contents: read
    with:
      compiler: "gcc"
      arch: "arm"
      defconfig: "socfpga_adi_defconfig"
      auto_from_range: false
  build_gcc_arm_zynq_pluto_defconfig:
    needs: [assert_checks]
    uses: analogdevicesinc/linux/.github/workflows/build.yml@ci
    secrets: inherit
    permissions:
      contents: read
    with:
      compiler: "gcc"
      arch: "arm"
      defconfig: "zynq_pluto_defconfig"
      auto_from_range: false
  build_gcc_arm_zynq_m2k_defconfig:
    needs: [assert_checks]
    uses: analogdevicesinc/linux/.github/workflows/build.yml@ci
    secrets: inherit
    permissions:
      contents: read
    with:
      compiler: "gcc"
      arch: "arm"
      defconfig: "zynq_m2k_defconfig"
      auto_from_range: false
  build_gcc_aarch64_adi_zynqmp_defconfig:
    needs: [assert_checks]
    uses: analogdevicesinc/linux/.github/workflows/build.yml@ci
    secrets: inherit
    permissions:
      contents: read
    with:
      compiler: "gcc"
      arch: "arm64"
      defconfig: "adi_zynqmp_defconfig"
      auto_from_range: false
  build_gcc_aarch64_adi_versal_defconfig:
    needs: [assert_checks]
    uses: analogdevicesinc/linux/.github/workflows/build.yml@ci
    secrets: inherit
    permissions:
      contents: read
    with:
      compiler: "gcc"
      arch: "arm64"
      defconfig: "adi_versal_defconfig"
      auto_from_range: false
  build_gcc_microblaze_adi_mb_defconfig:
    needs: [assert_checks]
    uses: analogdevicesinc/linux/.github/workflows/build.yml@ci
    secrets: inherit
    permissions:
      contents: read
    with:
      compiler: "gcc"
      arch: "microblaze"
      defconfig: "adi_mb_defconfig"
      auto_from_range: false
  build_gcc_nios2_adi_nios2_defconfig:
    needs: [assert_checks]
    uses: analogdevicesinc/linux/.github/workflows/build.yml@ci
    secrets: inherit
    permissions:
      contents: read
    with:
      compiler: "gcc"
      arch: "nios2"
      defconfig: "adi_nios2_defconfig"
      auto_from_range: false
  compile_devicetrees:
    needs: [assert_checks]
    uses: analogdevicesinc/linux/.github/workflows/compile-devicetrees.yml@ci
    secrets: inherit
    permissions:
      contents: read
    with:
      compiler: "gcc"
      archs: "arm arm64 microblaze nios2"
      dts_files: >
        arch/microblaze/boot/dts/*.dts
        arch/arm/boot/dts/xilinx/zynq-*.dts
        arch/arm/boot/dts/intel/socfpga/socfpga_*.dts
        arch/arm64/boot/dts/xilinx/zynqmp-*.dts
        arch/arm64/boot/dts/xilinx/versal-*.dts
        arch/nios2/boot/dts/*.dts
  assert_build:
    runs-on: [self-hosted, repo-only]
    permissions:
      contents: read
    needs:
      - build_gcc_arm_zynq_xcomm_adv7511_defconfig
      - build_gcc_arm_socfpga_adi_defconfig
      - build_gcc_arm_zynq_pluto_defconfig
      - build_gcc_arm_zynq_m2k_defconfig
      - build_gcc_aarch64_adi_zynqmp_defconfig
      - build_gcc_aarch64_adi_versal_defconfig
      - build_gcc_microblaze_adi_mb_defconfig
      - build_gcc_nios2_adi_nios2_defconfig
      - compile_devicetrees
    steps:
      - name: Assert
        env:
          job_build_gcc_arm_zynq_xcomm_adv7511_defconfig: ${{ needs.build_gcc_arm_zynq_xcomm_adv7511_defconfig.outputs.summary }}
          job_build_gcc_arm_socfpga_adi_defconfig: ${{ needs.build_gcc_arm_socfpga_adi_defconfig.outputs.summary }}
          job_build_gcc_arm_zynq_pluto_defconfig: ${{ needs.build_gcc_arm_zynq_pluto_defconfig.outputs.summary }}
          job_build_gcc_arm_zynq_m2k_defconfig: ${{ needs.build_gcc_arm_zynq_m2k_defconfig.outputs.summary }}
          job_build_gcc_aarch64_adi_zynqmp_defconfig: ${{ needs.build_gcc_aarch64_adi_zynqmp_defconfig.outputs.summary }}
          job_build_gcc_aarch64_adi_versal_defconfig: ${{ needs.build_gcc_aarch64_adi_versal_defconfig.outputs.summary }}
          job_build_gcc_microblaze_adi_mb_defconfig: ${{ needs.build_gcc_microblaze_adi_mb_defconfig.outputs.summary }}
          job_build_gcc_nios2_adi_nios2_defconfig: ${{ needs.build_gcc_nios2_adi_nios2_defconfig.outputs.summary }}
          job_compile_devicetrees: ${{ needs.compile_devicetrees.outputs.summary }}
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -L -o runner_env.sh \
            https://raw.githubusercontent.com/analogdevicesinc/linux/ci/ci/runner_env.sh
          source ./runner_env.sh
          assert_job_summary

  deploy_cloudsmith_build:
    needs: [assert_build]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    uses: analogdevicesinc/linux/.github/workflows/upload-to-cloudsmith.yml@ci
    secrets:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
        CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    permissions:
      id-token: write
      contents: write
      actions: read
    with:
      artifacts: >
        adi_versal_defconfig-*
        adi_zynqmp_defconfig-*
        socfpga_adi_defconfig-*
        zynq_m2k_defconfig-*
        zynq_pluto_defconfig-*
        zynq_xcomm_adv7511_defconfig-*
        adi_mb_defconfig-*
        adi_nios2_defconfig-*
        dtb-*


  deploy_kuiper_binaries:
    needs: [assert_build]
    if: >
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.pull_request.base.ref == 'main' ||
          github.event.pull_request.base.ref == 'next_stable' ||
          startsWith(github.event.pull_request.base.ref, 'xlnx/release/')
        )
      ) ||
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/next_stable' ||
          startsWith(github.ref, 'refs/heads/xlnx/release/')
        )
      ) &&
      (
        github.repository_owner == 'analogdevicesinc'
      )
    uses: analogdevicesinc/linux/.github/workflows/deploy-kuiper-artifacts.yml@ci
    secrets: inherit
    permissions:
      id-token: write
      contents: write
      actions: read
    with:
      pr-number: ${{ github.event.pull_request.number }}
      pr-target-branch: ${{ github.event.pull_request.base.ref }}
      artifacts: >
        adi_versal_defconfig-*
        adi_zynqmp_defconfig-*
        socfpga_adi_defconfig-*
        zynq_m2k_defconfig-*
        zynq_pluto_defconfig-*
        zynq_xcomm_adv7511_defconfig-*
        adi_mb_defconfig-*
        adi_nios2_defconfig-*
        dtb-*

  trigger_harness_job:
    needs: [deploy_kuiper_binaries]
    runs-on: ubuntu-SLIM
    if: needs.deploy_kuiper_binaries.result == 'success'
    steps:
      - name: Trigger Jenkins test harness
        run: |
          TIMESTAMP=$(date +%Y_%m_%d-%H_%M)
          BRANCH="${{ github.head_ref || github.ref_name }}"
          PR_ID="${{ github.event.pull_request.number }}"
          # to check if for JENKINS_URL we use ngrok or webhook relay  
          curl ${{ secrets.JENKINS_URL }}/job/Linux_TH/buildWithParameters \
            --user ${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_KEY }} \
            --data TIMESTAMP=${TIMESTAMP} \
            --data BRANCH=${BRANCH} \
            --data PR_ID=${PR_ID}
