%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/adi,sc5xx-clocks.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices ADSP-SC5xx SoC Clock Tree

maintainers:
  - Qasim Ijaz <qasim.ijaz@analog.com>
  - Arturs Artamonovs <arturs.artamonovs@analog.com>
  - Vasileios Bimpikas <vasileios.bimpikas@analog.com>
  - Caleb Ethridge <caleb.ethridge@analog.com>

description: |
  The ADSP-SC5xx clock architecture consists of two main
  hardware blocks, the CGU (clock generation unit) and
  the CDU (clock distribution unit). The CGU includes
  the PLL which produces an output clock which can then
  be divided via clock dividers, the output clocks after
  this stage can then be routed to the CDU. The CDU consists
  of an array of multiplexors that route clocks to various
  parts of the system. The CDU multiplexors have gating
  functionality to allow them to be enabled or disabled.

  The root clocks in the clock trees are SYS_CLKIN0 and
  SYS_CLKIN1, both clocks operate at 25Mhz and are modelled
  as fixed-rate clocks in the device tree.

  Each clock is associated with an identifier and consumer
  nodes can use this identifier to specify which clocks they
  consume from either the CGU directly or the CDU. All clocks
  available for usage by clock consumer nodes are defined in
  'include/dt-bindings/clock/adi-sc5xx-clock.h'.

properties:
  compatible:
    enum:
      - adi,sc598-cgu0
      - adi,sc598-cgu1
      - adi,sc598-cgu2
      - adi,sc598-cdu
      - adi,sc589-cgu0
      - adi,sc589-cgu1
      - adi,sc589-cdu
      - adi,sc573-cgu0
      - adi,sc573-cgu1
      - adi,sc573-cdu
      - adi,sc594-cgu0
      - adi,sc594-cgu1
      - adi,sc594-cdu

  clocks:
    description:
      Specifies the CLKIN0 and CLKIN1 reference clock(s) from which the
      output frequencies are derived via CDU+CGU
    minItems: 2
    maxItems: 2

  clock-names:
    description:
      String reference names for CLKIN0 and CLKIN1
    minItems: 2
    maxItems: 2

  '#clock-cells':
    const: 1

  reg:
    minItems: 3
    maxItems: 4

required:
  - compatible
  - reg
  - clocks
  - '#clock-cells'
  - clock-names

additionalProperties: false

examples:
  - |
    clocks@3108d000 {
      compatible = "adi,sc57x-clocks";
      reg = <0x3108d000 0x1000>,
            <0x3108e000 0x1000>,
            <0x3108f000 0x1000>;
      #clock-cells = <1>;
      clocks = <&sys_clkin0>, <&sys_clkin1>;
      clock-names = "sys_clkin0", "sys_clkin1";
      status = "okay";
    };

  - |
    clocks@3108d000 {
      compatible = "adi,sc58x-clocks";
      reg = <0x3108d000 0x1000>,
            <0x3108e000 0x1000>,
            <0x3108f000 0x1000>;
      #clock-cells = <1>;
      clocks = <&sys_clkin0>, <&sys_clkin1>;
      clock-names = "sys_clkin0", "sys_clkin1";
      status = "okay";
    };

  - |
    clocks@3108d000 {
      compatible = "adi,sc594-clocks";
      reg = <0x3108d000 0x1000>,
            <0x3108e000 0x1000>,
            <0x3108f000 0x1000>;
      #clock-cells = <1>;
      clocks = <&sys_clkin0>, <&sys_clkin1>;
      clock-names = "sys_clkin0", "sys_clkin1";
      status = "okay";
    };

  - |
    clocks@3108d000 {
      compatible = "adi,sc598-clocks";
      reg = <0x3108d000 0x1000>,
            <0x3108e000 0x1000>,
            <0x3108f000 0x1000>,
            <0x310a9000 0x1000>;
      #clock-cells = <1>;
      clocks = <&sys_clkin0>, <&sys_clkin1>;
      clock-names = "sys_clkin0", "sys_clkin1";
      status = "okay";
    };
