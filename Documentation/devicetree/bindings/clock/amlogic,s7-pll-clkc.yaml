%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/amlogic,s7-pll-clkc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic S7 Series PLL Clock Controller

maintainers:
  - Neil Armstrong <neil.armstrong@linaro.org>
  - Jerome Brunet <jbrunet@baylibre.com>
  - Carlo Caione <ccaione@baylibre.com>

properties:
  compatible:
    const: amlogic,s7-pll-clkc

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  clocks:
    items:
      - description: input fixed pll
      - description: input gp0 pll
      - description: input hifi0 pll
      - description: input hifi1 pll
      - description: input hdmi pll

  clock-names:
    items:
      - const: fix
      - const: gp0
      - const: hifi0
      - const: hifi1
      - const: hdmi

required:
  - compatible
  - reg
  - '#clock-cells'
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        clock-controller@fe008000 {
            compatible = "amlogic,s7-pll-clkc";
            reg = <0x0 0xfe008000 0x0 0x1e8>;
            #clock-cells = <1>;
            clocks = <&scmi_clk 2>,
                     <&scmi_clk 2>,
                     <&scmi_clk 2>,
                     <&scmi_clk 2>,
                     <&scmi_clk 3>;
            clock-names = "fix",
                          "gp0",
                          "hifi0",
                          "hifi1",
                          "hdmi";
        };
    };
