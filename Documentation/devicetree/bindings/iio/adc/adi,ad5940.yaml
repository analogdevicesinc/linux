%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/adi,ad5940.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices AD5940/AD5941 High Precision, Impedance and Electrochemical Front End

maintainers:
  - Song Qiang <songqiang1304521@gmail.com>

description: |
  Analog Devices AD5940 and AD5941 high precision, impedance and
  electrochemical analog front ends with an SPI interface. The two parts only
  differ in package: the AD5941 has 3 AFE GPIOs and no AIN6 input.

  Datasheet:
    https://www.analog.com/media/en/technical-documentation/data-sheets/ad5940-5941.pdf

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: adi,ad5941
    then:
      properties:
        adi,interrupt-io:
          const: 0

properties:
  compatible:
    enum:
      - adi,ad5940
      - adi,ad5941

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 12500000

  avdd-supply:
    description: Analog supply (AVDD), 2.8 V to 3.6 V.

  dvdd-supply:
    description:
      Digital supply (DVDD), 2.8 V to 3.6 V. It must be driven before IOVDD.

  iovdd-supply:
    description: Digital input/output supply (IOVDD), 1.8 V or 2.8 V to 3.6 V.

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: Active low RESET pin.

  adi,interrupt-io:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Index of the AFE GPIO that outputs the interrupt controller 0 signal.
      Only GPIO0 is available on the AD5941.
    enum: [0, 3, 6]

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

patternProperties:
  "^channel@[0-9a-f]+$":
    type: object
    $ref: adc.yaml
    unevaluatedProperties: false

    properties:
      reg:
        description: Index of this channel, starting from 0.
        maxItems: 1

      diff-channels:
        description: |
          Positive and negative input of the ADC mux for this channel. The
          allowed values are defined in
          include/dt-bindings/iio/adc/adi,ad5940.h, with AD5940_ADC_INPUTP_*
          for the positive input and AD5940_ADC_INPUTN_* for the negative one.

      label:
        description: Name assigned to this channel.

    required:
      - reg
      - diff-channels

required:
  - compatible
  - reg
  - avdd-supply
  - dvdd-supply
  - iovdd-supply
  - interrupts
  - adi,interrupt-io
  - '#address-cells'
  - '#size-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/iio/adc/adi,ad5940.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        adc@0 {
            compatible = "adi,ad5940";
            reg = <0>;
            spi-max-frequency = <12500000>;
            avdd-supply = <&vdd_3v3>;
            dvdd-supply = <&vdd_3v3>;
            iovdd-supply = <&vdd_3v3>;
            interrupt-parent = <&gpio>;
            interrupts = <24 IRQ_TYPE_EDGE_FALLING>;
            adi,interrupt-io = <0>;
            #address-cells = <1>;
            #size-cells = <0>;

            channel@0 {
                reg = <0>;
                diff-channels = <AD5940_ADC_INPUTP_VCE0
                                 AD5940_ADC_INPUTN_VBIAS0>;
                label = "Vce-Vbias";
            };

            channel@1 {
                reg = <1>;
                diff-channels = <AD5940_ADC_INPUTP_AIN0
                                 AD5940_ADC_INPUTN_VBIAS0>;
                label = "ain0-Vbias";
            };
        };
    };
...
