%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/ti,tla2528.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments TLA2528 8-channel 12-bit I2C ADC

maintainers:
  - Maxime Chevallier <maxime.chevallier@bootlin.com>

description:
  Each of the 8 input pins can be configured as an analog input, a digital
  input or a digital output.

properties:
  compatible:
    const: ti,tla2528

  reg:
    maxItems: 1

  avdd-supply:
    description: Analog supply, also used as the ADC reference voltage.

  dvdd-supply: true

  gpio-controller: true

  "#gpio-cells":
    const: 2

  "#io-channel-cells":
    const: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^channel@[0-7]$":
    type: object
    $ref: adc.yaml
    description: Represents an analog input.

    properties:
      reg:
        description: AIN pin number
        minimum: 0
        maximum: 7

    required:
      - reg

    unevaluatedProperties: false

required:
  - compatible
  - reg
  - avdd-supply
  - dvdd-supply

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        adc@17 {
            compatible = "ti,tla2528";
            reg = <0x17>;
            avdd-supply = <&reg_adc_supply>;
            dvdd-supply = <&reg_adc_supply>;
            #io-channel-cells = <1>;
            #address-cells = <1>;
            #size-cells = <0>;

            channel@0 {
                reg = <0>;
            };

            channel@3 {
                reg = <3>;
            };
        };
    };
...
