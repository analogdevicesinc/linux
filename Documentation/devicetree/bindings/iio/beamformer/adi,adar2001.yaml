%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/beamformer/adi,adar2001.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices ADAR2001 Frequency Multiplier and Filter Transmitter

maintainers:
  - Kim Seer Paller <kimseer.paller@analog.com>

description: |
  Analog Devices ADAR2001 10GHz to 40GHz, 1:4 channel, 4x frequency multiplier
  and filter transmitter. A 2.5GHz to 10GHz input is multiplied by four, passed
  through a selectable bandpass and notch filter and a 5-bit step attenuator,
  then split into four outputs, each with its own power amplifier and RF power
  detector. A temperature diode and the four detectors share one 8-bit ADC.
  Two on-chip sequencers step the transmit and the multiplier and filter
  blocks through a programmed list of modes. Each has an advance and a reset
  pin, and each can also be driven over SPI. The pins are the faster path and
  are used whenever they are described here.
  Datasheet can be found here:
  https://www.analog.com/media/en/technical-documentation/data-sheets/ADAR2001.pdf

properties:
  compatible:
    const: adi,adar2001

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 15000000

  vpos-supply:
    description:
      2.5V analog supply, feeding the VPOS1, VPOS3, VPOS4 and VPOS5 pins.

  vpos2-supply:
    description:
      1.8V digital supply feeding the VPOS2 pin. Optional, because the
      reference wiring straps VPOS2 to the on-chip regulator output VREG
      instead of to a board rail.

  tx-advance-gpios:
    description:
      TxADV pin. An active-high pulse advances the transmit sequencer to the
      next state, wrapping to state 1 at the end of the cycle.
    maxItems: 1

  tx-reset-gpios:
    description:
      TxRST pin. An active-high pulse returns the transmit sequencer to state
      0, which always applies mode 0.
    maxItems: 1

  multiplier-advance-gpios:
    description:
      MADV pin. An active-high pulse advances the multiplier and filter
      sequencer to the next state, wrapping to state 1 at the end of the
      cycle.
    maxItems: 1

  multiplier-reset-gpios:
    description:
      MRST pin. An active-high pulse returns the multiplier and filter
      sequencer to state 0, which always applies mode 0.
    maxItems: 1

required:
  - compatible
  - reg

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        transmitter@0 {
            compatible = "adi,adar2001";
            reg = <0>;
            spi-max-frequency = <15000000>;
            vpos-supply = <&vdd_2v5>;
            tx-advance-gpios = <&gpio 5 GPIO_ACTIVE_HIGH>;
            tx-reset-gpios = <&gpio 6 GPIO_ACTIVE_HIGH>;
            multiplier-advance-gpios = <&gpio 13 GPIO_ACTIVE_HIGH>;
            multiplier-reset-gpios = <&gpio 19 GPIO_ACTIVE_HIGH>;
        };
    };
...
