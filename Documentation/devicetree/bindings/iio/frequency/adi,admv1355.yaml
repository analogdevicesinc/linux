%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/frequency/adi,admv1355.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices ADMV1355 Microwave Upconverter

maintainers:
  - George Mois <george.mois@analog.com>
  - Rodrigo Alencar <rodrigo.alencar@analog.com>

description: |
  The ADMV1355 is a highly integrated microwave upconverter optimized for
  wideband radio designs operating in the 17.7 GHz to 55 GHz RF range.

  The integrated local oscillator (LO) signal chain accepts LO input
  signals in the 8.85 GHz to 27.5 GHz range with an internal 2x frequency
  multiplier, programmable harmonic-reject filter, and I/Q phase-adjust
  circuitry.

  Three frequency translation mixer modes are supported: baseband I/Q
  differential input (DC to 12 GHz), complex IF input (1 GHz to 12 GHz),
  and IF hybrid input (8 GHz to 12 GHz).

  Datasheet:
    https://www.analog.com/en/products/admv1355.html

properties:
  compatible:
    const: adi,admv1355

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 50000000

  spi-device-addr:
    maxItems: 1
    items:
      enum: [0, 1, 2, 3]
    default: 0
    description:
      Chip address selected by the CHIP_ADD0 and CHIP_ADD1 balls, allowing up
      to four devices to share a single SPI chip select. A ball left floating
      reads as 1 due to its internal pull-up.

  clocks:
    description:
      LO input clock. The clock rate must represent the actual frequency at
      the LO input pin. If the clock source is divided before reaching the
      device, the divider should be modeled with a fixed-factor-clock node.
    maxItems: 1

  clock-names:
    items:
      - const: lo-input

  dvdd-supply:
    description: Digital supply (1.8 V).

  vdd-bg-supply:
    description: Bandgap reference supply (1.8 V).

  vdd-lo-supply:
    description: LO signal chain supply (1.8 V).

  vdd-mix-supply:
    description: Mixer supply (1.8 V).

  vdd-vga-supply:
    description: VGA supply (1.8 V).

  vdd-drv-supply:
    description: RF driver amplifier supply (3 V).

  adi,baseband-vicm-microvolt:
    description:
      Common-mode voltage of the baseband I/Q inputs (BB_IP, BB_IN, BB_QP and
      BB_QN), as set by the source driving them. At 0.5 V or less, the mixer
      gate bias must be set manually for the given voltage. When absent, the
      mixer gate bias is set automatically.
    minimum: 0
    maximum: 1550000

  reset-gpios:
    description: GPIO connected to the active-low RST pin.
    maxItems: 1

  enable-gpios:
    description:
      GPIO connected to the active-high CEN (chip enable) pin. CEN must be
      held low until all supply voltages are stable and RST is deasserted.
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - dvdd-supply
  - vdd-bg-supply
  - vdd-lo-supply
  - vdd-mix-supply
  - vdd-vga-supply
  - vdd-drv-supply

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        mixer@0 {
            compatible = "adi,admv1355";
            reg = <0>;
            spi-max-frequency = <1000000>;
            spi-device-addr = <0>;
            clocks = <&lo_input_clk>;
            clock-names = "lo-input";
            dvdd-supply = <&vdd_1v8>;
            vdd-bg-supply = <&vdd_1v8>;
            vdd-lo-supply = <&vdd_1v8>;
            vdd-mix-supply = <&vdd_1v8>;
            vdd-vga-supply = <&vdd_1v8>;
            vdd-drv-supply = <&vdd_3v0>;
            reset-gpios = <&gpio0 88 GPIO_ACTIVE_LOW>;
            enable-gpios = <&gpio0 89 GPIO_ACTIVE_HIGH>;
            adi,baseband-vicm-microvolt = <250000>;
        };
    };
...
