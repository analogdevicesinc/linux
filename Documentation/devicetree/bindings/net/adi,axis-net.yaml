%YAML 1.2
---
$id: http://devicetree.org/schemas/net/adi,axis-net.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices AXI-Stream point-to-point Ethernet

maintainers:
  - Analog Devices Inc.

description: |
  A point-to-point Ethernet link carried over a pair of AXI-Stream DMA
  channels, used to connect two processors joined by FPGA fabric.

  Each side of the link needs two ADI AXI-DMAC instances configured in stream
  mode: one MEM_TO_DEV to drive the outbound stream, and one DEV_TO_MEM to
  receive the inbound stream. The two sides' DMACs are paired back to back in
  the fabric, ideally through an AXI4-Stream FIFO for elasticity and any
  required clock-domain crossing.

  The receiving DMAC must be configured to terminate its transfer on TLAST, so
  that a posted maximum-size descriptor closes at the end of each frame rather
  than coalescing consecutive frames.

  This binding is symmetric: an identical node is placed on each side of the
  link, referencing that side's own DMACs.

allOf:
  - $ref: ethernet-controller.yaml#

properties:
  compatible:
    const: adi,axis-net

  dmas:
    items:
      - description: outbound channel, must be MEM_TO_DEV
      - description: inbound channel, must be DEV_TO_MEM

  dma-names:
    items:
      - const: tx
      - const: rx

required:
  - compatible
  - dmas
  - dma-names

unevaluatedProperties: false

examples:
  - |
    ethernet {
        compatible = "adi,axis-net";
        dmas = <&net_tx_dma 0>, <&net_rx_dma 0>;
        dma-names = "tx", "rx";
        local-mac-address = [00 0a 35 00 00 01];
    };
