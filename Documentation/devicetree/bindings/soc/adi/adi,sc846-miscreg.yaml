%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/adi/adi,sc846-miscreg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices SC84x miscellaneous system registers (MISCREG)

maintainers:
  - Nuno Sá <nuno.sa@analog.com>

description: |
  MISCREG is the integration register file of the Analog Devices ADSP-SC84x.
  It gathers glue registers belonging to several otherwise unrelated hardware
  blocks:

    - tie-off ("bootstrap") inputs and reset masks for the two xSPI
      controllers and their PHYs
    - low power mode and soft reset requests for the two CAN-FD controllers
    - clock multiplexer selections for the timers, PWM, PCG and PTP inputs,
      and the Frac-N PLL output divider stage
    - RGMII pad skew for the two Ethernet MACs
    - DDR prefetch window selection for the SHARC-FX cores

properties:
  compatible:
    items:
      - const: adi,sc846-miscreg
      - const: simple-mfd
      - const: syscon

  reg:
    maxItems: 1

  reset-controller:
    $ref: /schemas/reset/adi,sc846-miscreg-reset.yaml#

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@310a9000 {
        compatible = "adi,sc846-miscreg", "simple-mfd", "syscon";
        reg = <0x310a9000 0x1000>;

        reset-controller {
            compatible = "adi,sc846-miscreg-reset";
            #reset-cells = <1>;
        };
    };
