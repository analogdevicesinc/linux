%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/adi,sc5xx-gptimers.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ADI ADSP-SC5xx / SC84x general-purpose timer block

maintainers:
  - Michael Hennerich <michael.hennerich@analog.com>

description: |
  Block of up to 16 general-purpose 32-bit timers. Individual timers are
  described as children and can serve as the system clocksource, the
  clockevent device, userspace counters, or as a TRU trigger generator
  that converts edges on the timer's TMR input pin into trigger pulses
  (EXTCLK mode with PER=1) — the data-ready trigger source for SPI
  offload streaming.

properties:
  compatible:
    const: adi,sc5xx-gptimers

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^gptimer@[0-9a-f]+$":
    type: object
    additionalProperties: false

    properties:
      reg:
        description: Timer index within the block (0..15).
        maxItems: 1

      interrupts:
        maxItems: 1

      clocks:
        description: The timer block clock (SCLK0), also referenced per
          timer by some SoC device trees.
        maxItems: 1

      adi,offset:
        description: Byte offset of this timer's register group within
          the block.
        $ref: /schemas/types.yaml#/definitions/uint32

      adi,is-clocksource:
        description: Register this timer as the system clocksource.
        type: boolean

      adi,is-clockevent:
        description: Register this timer as the clockevent device.
        type: boolean

      adi,reset-timer:
        description: Reinitialize the timer even if firmware left it
          running.
        type: boolean

      adi,mode-extclk-gen:
        description: |
          Dedicate this timer as a TRU trigger generator: EXTCLK mode
          counting edges on the TMR input pin with PER=1, so every input
          edge fires the timer's TRG output into the Trigger Routing
          Unit. The timer is then a pure trigger source (no clocksource,
          clockevent or counter registration). Requires the TMR pin to be
          pinmuxed to the timer and its pad input buffer enabled.
        type: boolean

      adi,extclk-active-low:
        description: In EXTCLK trigger-generator mode, count falling
          edges of the TMR input instead of rising edges (for active-low
          data-ready strobes).
        type: boolean

    required:
      - reg
      - interrupts
      - adi,offset

required:
  - compatible
  - reg
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    timers@31018000 {
        compatible = "adi,sc5xx-gptimers";
        reg = <0x31018000 0x200>;
        clocks = <&clk 19>;
        #address-cells = <1>;
        #size-cells = <0>;

        gptimer@0 {
            reg = <0>;
            interrupts = <GIC_SPI 48 IRQ_TYPE_LEVEL_HIGH>;
            adi,offset = <0x60>;
            adi,mode-extclk-gen;
            adi,extclk-active-low;
        };

        gptimer@1 {
            reg = <1>;
            interrupts = <GIC_SPI 49 IRQ_TYPE_LEVEL_HIGH>;
            adi,offset = <0x80>;
            adi,is-clockevent;
            adi,reset-timer;
        };
    };
...
